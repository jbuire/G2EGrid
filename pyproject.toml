[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g2egrid"
version = "0.1.0"
description = "Small-signal modelling of power systems with a high share of power electronics: symbolic DAE models assembled into a global state-space model"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jerome Buire", email = "jerome.buire@grenoble-inp.fr" }]
keywords = ["power systems", "small-signal stability", "power electronics", "grid-forming", "grid-following", "modal analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.7"]
control = ["control>=0.10"]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Repository = "https://github.com/jbuire/g2elin_v2"
Issues = "https://github.com/jbuire/g2elin_v2/issues"

[project.scripts]
# l'atelier en une commande, une fois installe avec l'extra api :
#   pipx install --editable "./python[api]"   puis   g2egrid-atelier
g2egrid-atelier = "g2egrid_api.__main__:main"

[tool.setuptools.packages.find]
include = ["g2egrid*"]

[tool.setuptools.package-data]
g2egrid_api = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# g2egrid_api n'est pas installe dans l'environnement : il l'etait de fait
# depuis un shell, ou le repertoire courant se retrouve sur sys.path, mais
# pas sous pytest -- d'ou un "No module named g2egrid_api" au premier test qui
# le touche. La racine du projet suffit a le rendre importable, et g2egrid y
# designe exactement les memes fichiers que l'installation editable.
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]
docs = [
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
e2e = [
    "playwright>=1.63.0",
]
validation = [
    "andes>=1.10.1",
]

[tool.ruff]
# Les notebooks de reseaux_test/ sont mis en forme a la main : leurs tables de
# donnees sont alignees colonne par colonne, comme les tables MATLAB, et le
# formateur les remettrait sur une ligne par argument.
extend-exclude = ["reseaux_test/*.ipynb", "etudes/*.ipynb"]
